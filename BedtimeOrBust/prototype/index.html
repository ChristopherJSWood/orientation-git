<script type="module">
// Bedtime or Bust — reference rules engine (JavaScript).
//
// This file is the executable specification of the game rules. The Swift
// engine in Core/Sources/BedtimeCore/Engine.swift must behave identically;
// tools/golden.mjs records traces from this engine and the Swift test suite
// replays them (Core/Tests/BedtimeCoreTests/ConformanceTests.swift).
//
// Determinism contract (both engines):
//   * RNG is mulberry32 over a 32-bit unsigned state.
//   * Exactly one RNG draw per weighted pick: day modifier at start, the next
//     random (non-priority) event, and an outcome when a choice has >1 outcome.
//   * Integer meters, clamped to [0, 100] after every change.

const METERS = ["sanity", "mood", "home", "rep", "sleepy"];

function mulberry32(seed) {
  let a = seed | 0;
  return function next() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function weightedPick(items, weightOf, rng) {
  let total = 0;
  for (const it of items) total += weightOf(it);
  const r = rng() * total;
  let acc = 0;
  for (let i = 0; i < items.length; i++) {
    acc += weightOf(items[i]);
    if (r < acc) return i;
  }
  return items.length - 1;
}

const clamp = (v) => (v < 0 ? 0 : v > 100 ? 100 : v);

function meets(cond, s) {
  if (!cond) return true;
  for (const f of cond.flags ?? []) if (!s.flags.has(f)) return false;
  for (const f of cond.notFlags ?? []) if (s.flags.has(f)) return false;
  for (const [k, v] of Object.entries(cond.min ?? {})) if (s.meters[k] < v) return false;
  for (const [k, v] of Object.entries(cond.max ?? {})) if (s.meters[k] > v) return false;
  return true;
}

function formatClock(minutes) {
  const m = ((minutes % 1440) + 1440) % 1440;
  const h24 = Math.floor(m / 60);
  const mm = m % 60;
  const suffix = h24 < 12 ? "AM" : "PM";
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return `${h12}:${String(mm).padStart(2, "0")} ${suffix}`;
}

class Game {
  constructor(content, seed) {
    this.content = content;
    this.cfg = content.config;
    this.rng = mulberry32(seed >>> 0);
    this.state = {
      seed: seed >>> 0,
      clock: this.cfg.startClock,
      meters: { ...this.cfg.startMeters },
      flags: new Set(),
      counters: {},
      seen: new Set(),
      lastEventId: null,
      currentEventId: null,
      modifierId: null,
      step: 0,
      endingId: null,
    };
    const mods = content.modifiers;
    const mod = mods[weightedPick(mods, (m) => m.weight ?? 1, this.rng)];
    this.state.modifierId = mod.id;
    this.#apply(mod.effects, mod.set, null, null);
    this.state.currentEventId = this.#nextEvent().id;
  }

  get modifier() {
    return this.content.modifiers.find((m) => m.id === this.state.modifierId);
  }
  get currentEvent() {
    const id = this.state.currentEventId;
    return id == null ? null : this.content.events.find((e) => e.id === id);
  }
  get ending() {
    const id = this.state.endingId;
    return id == null ? null : { id, ...this.content.endings[id] };
  }
  get isOver() {
    return this.state.endingId != null;
  }

  visibleChoices(event = this.currentEvent) {
    if (!event) return [];
    return event.choices.filter((c) => meets(c.when, this.state));
  }

  choose(visibleIndex) {
    if (this.isOver) throw new Error("game is over");
    const ev = this.currentEvent;
    const choices = this.visibleChoices(ev);
    if (!(visibleIndex >= 0 && visibleIndex < choices.length)) throw new Error(`bad choice ${visibleIndex}`);
    const choice = choices[visibleIndex];
    const before = { ...this.state.meters };

    let outcomeIndex = 0;
    if (choice.outcomes.length > 1) {
      outcomeIndex = weightedPick(choice.outcomes, (o) => o.weight ?? 1, this.rng);
    }
    const out = choice.outcomes[outcomeIndex];
    this.#apply(out.effects, out.set, out.clear, out.count);
    const minutes = choice.duration + (this.cfg.eventGap ?? 0);
    this.#advance(minutes);

    const s = this.state;
    s.seen.add(ev.id);
    s.lastEventId = ev.id;
    s.step += 1;

    let endingId = null;
    if (s.meters.sanity <= 0) endingId = "meltdown";
    else if (s.meters.home <= 0) endingId = "ballpit";
    else if (s.meters.rep <= 0) endingId = "groupchat";
    else if (ev.final) endingId = this.#bedtimeEnding();

    if (endingId) {
      s.endingId = endingId;
      s.currentEventId = null;
    } else {
      s.currentEventId = this.#nextEvent().id;
    }

    const deltas = {};
    for (const m of METERS) if (s.meters[m] !== before[m]) deltas[m] = s.meters[m] - before[m];
    return { eventId: ev.id, choiceIndex: visibleIndex, outcomeIndex, text: out.text, deltas, minutes, endingId };
  }

  // Rank of the asleep ending from the four "quality" meters (sleepy excluded).
  score() {
    const m = this.state.meters;
    return m.sanity + m.mood + m.home + m.rep;
  }

  #bedtimeEnding() {
    if (this.state.meters.sleepy < this.cfg.asleepThreshold) return "second_wind";
    const total = this.score();
    for (const g of this.cfg.grades) if (total >= g.min) return g.id;
    return this.cfg.grades[this.cfg.grades.length - 1].id;
  }

  #apply(effects, set, clear, count) {
    const s = this.state;
    for (const [k, v] of Object.entries(effects ?? {})) s.meters[k] = clamp(s.meters[k] + v);
    for (const f of set ?? []) s.flags.add(f);
    for (const f of clear ?? []) s.flags.delete(f);
    for (const [k, v] of Object.entries(count ?? {})) s.counters[k] = (s.counters[k] ?? 0) + v;
  }

  // Passive drift while time passes. Ticks are counted on minutes since the
  // start of the day so that drift does not depend on how time is chunked.
  #advance(minutes) {
    const s = this.state;
    const cfg = this.cfg;
    const t0 = s.clock - cfg.startClock;
    const t1 = t0 + minutes;
    const ticks = (every) => Math.floor(t1 / every) - Math.floor(t0 / every);
    s.meters.sleepy = clamp(s.meters.sleepy + ticks(cfg.sleepyEvery));
    for (const m of METERS) {
      const every = cfg.drainEvery?.[m];
      if (every) s.meters[m] = clamp(s.meters[m] - ticks(every));
    }
    if (s.meters.sleepy >= cfg.overtiredAt) {
      s.meters.mood = clamp(s.meters.mood - ticks(cfg.overtiredMoodEvery));
    }
    s.clock += minutes;
  }

  #nextEvent() {
    const s = this.state;
    const cands = this.content.events.filter(
      (e) =>
        !e.filler &&
        (e.repeatable || !s.seen.has(e.id)) &&
        e.id !== s.lastEventId &&
        s.clock >= e.window[0] &&
        s.clock <= e.window[1] &&
        meets(e.when, s) &&
        this.visibleChoices(e).length > 0,
    );
    let best = null;
    for (const e of cands) if ((e.priority ?? 0) > 0 && (best == null || e.priority > best.priority)) best = e;
    if (best) return best;
    const pool = cands.filter((e) => !((e.priority ?? 0) > 0));
    if (pool.length === 0) return this.content.events.find((e) => e.filler);
    return pool[weightedPick(pool, (e) => e.weight ?? 1, this.rng)];
  }
}

// Serializable snapshot (used by golden traces and tests).
function snapshot(game) {
  const s = game.state;
  return {
    clock: s.clock,
    meters: { ...s.meters },
    flags: [...s.flags].sort(),
    counters: Object.fromEntries(Object.entries(s.counters).sort(([a], [b]) => (a < b ? -1 : 1))),
    modifierId: s.modifierId,
    step: s.step,
    endingId: s.endingId,

ic who has already decided to write a bad review.","window":[1050,1140],"priority":40,"choices":[{"label":"Hide the broccoli inside a dinosaur nugget","duration":25,"outcomes":[{"weight":1,"text":"Twenty-five minutes of nugget surgery. They eat around the broccoli. Also surgically.","effects":{"mood":6,"sanity":-6}},{"weight":1,"text":"It works. They eat a vegetable without knowing it. You feel like a spy. A tired spy.","effects":{"mood":6,"sanity":4,"rep":4}}]},{"label":"Serve buttered noodles. Again.","duration":10,"outcomes":[{"text":"Plain buttered noodles: the official cuisine of toddlerhood. Somewhere, a pediatric nutritionist feels a disturbance.","effects":{"mood":10,"rep":-5}}]},{"label":"Insist on one bite. Just one.","duration":20,"outcomes":[{"weight":4,"text":"One green bean is consumed with the expression of someone being poisoned. You'll take it.","effects":{"mood":-3,"sanity":5,"rep":4}},{"weight":6,"text":"The bean is not eaten. The bean is thrown. The bean is part of your ceiling now.","effects":{"mood":-12,"sanity":-6,"home":-6},"count":{"noSaid":1}}]}]},{"id":"bath","title":"Bath Time","text":"The bath is either the best thing that has ever happened or a violation of human rights. There is no way to know which until the water is running.","window":[1110,1165],"priority":30,"choices":[{"label":"Bubble bath, full spa treatment","duration":25,"outcomes":[{"text":"Half the water is on the floor. The bathroom smells like \"Lavender Dreams.\" Your socks are wet forever. But they're yawning.","effects":{"sleepy":10,"mood":5,"home":-8}}]},{"label":"Quick rinse. No bubbles.","duration":10,"outcomes":[{"text":"In and out. Efficient. Clinical. They are clean and they are disappointed in you.","effects":{"sleepy":5,"mood":-5}},{"text":"\"WHERE ARE THE BUBBLES.\" Not a question. A demand. The rinse becomes a hostage negotiation.","effects":{"mood":-10,"sanity":-4}}]},{"label":"Skip it. They're clean enough. Probably.","duration":2,"outcomes":[{"text":"There's yogurt in their hair. That's practically conditioner.","effects":{"rep":-4,"sanity":4}}]}]},{"id":"bedtime","title":"Bedtime: The Final Boss","text":"It's 7:30. Pajamas are on, after a ten-minute chase. Teeth are brushed: one tooth, briefly. Now comes the negotiation.","window":[1170,1440],"priority":100,"final":true,"choices":[{"label":"Full routine: three books, two songs, one sip of water","duration":30,"outcomes":[{"text":"Three books become five. Two songs become an encore. The sip of water becomes a legal argument. But their eyes are closing, and they tell you they love you.","effects":{"sleepy":14,"sanity":-4,"mood":6}}]},{"label":"Speedrun: kiss, lights out, close the door","duration":5,"outcomes":[{"weight":1,"text":"You close the door. Silence. You don't trust it, so you do the dishes in a state of high alert.","effects":{"sanity":3,"home":6}},{"weight":1,"text":"The door clicks shut. A small voice says, \"I need to tell you something.\" It's about a dog they saw in April.","effects":{"sleepy":-8,"sanity":-3}}]},{"label":"Lie down next to them \"for just a minute\"","duration":40,"outcomes":[{"text":"You wake up at 9:15 PM on a toddler bed, wearing jeans, with a stuffed rabbit on your face. It worked. The dishes did not do themselves.","effects":{"sleepy":20,"sanity":5,"home":-8}}]}]},{"id":"meltdown","title":"Full Meltdown","text":"Something has gone wrong. Maybe the banana. Maybe the concept of time. Your toddler is a boneless puddle on the floor, screaming at a frequency only dogs and parents can hear.","window":[0,1440],"priority":90,"repeatable":true,"when":{"max":{"mood":0}},"choices":[{"label":"Get on the floor and validate their feelings","duration":15,"outcomes":[{"text":"\"You're frustrated that the sky is the wrong blue.\" It works. You are now covered in floor dust and inner peace.","effects":{"mood":35,"sanity":-12},"count":{"tantrums":1,"gentle":1}}]},{"label":"Wait it out. Stay calm. Become a rock.","duration":10,"outcomes":[{"text":"You become a rock. The storm passes, as storms do. Most last only a few minutes. This one felt like a fiscal quarter.","effects":{"mood":30,"sanity":-8},"count":{"tantrums":1}}]},{"label":"Deploy emergency crackers","duration":3,"outcomes":[{"text":"Goldfish-shaped crackers: the duct tape of parenting. Peace is restored. Precedent is set.","effects":{"mood":40,"sanity":-3,"rep":-5},"count":{"tantrums":1,"snacks":1}}]}]},{"id":"filler","title":"A Quiet Moment","text":"It's quiet. Too quiet. Your toddler is sitting calmly in a corner. When they see you, they say, \"I didn't do it.\" You don't know what \"it\" is.","window":[0,1440],"filler":true,"repeatable":true,"choices":[{"label":"Investigate","duration":10,"outcomes":[{"text":"It was the lipstick. It was always going to be the lipstick.","effects":{"home":-5,"sanity":-2}}]},{"label":"Don't ask questions you don't want answered","duration":10,"outcomes":[{"text":"You will find out at 4 PM. It involves the toilet.","effects":{"sanity":3,"home":-8}}]}]},{"id":"coffee","title":"Coffee, Attempt #2","text":"You made coffee at 6:15. It is now room temperature. The microwave beckons.","window":[380,1020],"weight":3,"repeatable":true,"choices":[{"label":"Reheat it","duration":5,"outcomes":[{"weight":3,"text":"You reheat it. You set it down. You will find it tomorrow, inside the microwave.","effects":{"sanity":3},"count":{"coffee":1}},{"weight":2,"text":"You drink it. While it is hot. A single tear rolls down your cheek.","effects":{"sanity":10},"count":{"coffee":1}}]},{"label":"Drink it cold. Embrace it.","duration":3,"outcomes":[{"text":"Iced coffee. You meant to do that. It's a lifestyle now.","effects":{"sanity":5}}]}]},{"id":"wrong_cup","title":"The Wrong Cup","text":"You poured milk into the blue cup. Your toddler wanted the blue cup. But not like this.","window":[370,1100],"weight":2,"choices":[{"label":"Switch to the green cup","duration":5,"outcomes":[{"text":"The green cup is accepted. You are a hostage negotiator now. The hostage is you.","effects":{"mood":6,"sanity":-3}}]},{"label":"Hold firm. Blue is a perfectly good cup.","duration":10,"outcomes":[{"weight":1,"text":"They drink from the blue cup while staring at you the entire time, like a mob boss. Boundaries: held.","effects":{"mood":-2,"sanity":4,"rep":3},"count":{"noSaid":1}},{"weight":3,"text":"The milk goes on the floor. \"I want the blue cup,\" they sob, holding the blue cup. The parenting forums would be proud of you. The floor is not.","effects":{"mood":-12,"sanity":-4,"home":-4,"rep":3},"count":{"noSaid":1}}]},{"label":"Pour it into the green cup, then back into the blue cup","duration":5,"outcomes":[{"text":"The milk has been purified by its journey. It is now acceptable.","effects":{"mood":8}},{"text":"\"That's green milk now,\" they explain. Irreversible contamination.","effects":{"mood":-6,"sanity":-2}}]}]},{"id":"dressed","title":"Getting Dressed","text":"Your toddler agrees to get dressed, on the condition that they wear: rain boots, one sock, a tutu, and a Halloween costume from two years ago that no longer fits.","window":[400,660],"weight":3,"choices":[{"label":"Let them wear it. Autonomy!","duration":5,"outcomes":[{"text":"You'll call it \"self-expression.\" A stranger at the store will compliment the look. They will be lying.","effects":{"mood":10,"rep":-7}}]},{"label":"Negotiate down to just the boots","duration":15,"outcomes":[{"text":"Fifteen minutes of tense diplomacy. The boots stay. The costume goes. Both sides claim victory.","effects":{"mood":3,"sanity":-4}}]},{"label":"Insist on the outfit you picked","duration":20,"outcomes":[{"weight":7,"text":"You win. They are wearing your outfit. They are also lying face-down in the hallway like a starfish.","effects":{"mood":-14,"sanity":-5,"rep":3},"count":{"noSaid":1}},{"weight":3,"text":"They comply, then give you the silent treatment. It lasts four minutes, an eternity in toddler time.","effects":{"mood":-4,"rep":5},"count":{"noSaid":1}}]}]},{"id":"blowout","title":"Code Brown","text":"A diaper situation has escalated beyond the diaper. It's up the back. It's in the onesie. Is it on the ceiling fan? No. Don't think about the ceiling fan.","window":[370,1100],"weight":2,"choices":[{"label":"Pull the onesie down over the shoulders, paramedic-style","duration":10,"outcomes":[{"text":"You learned this from a forum. Onesie shoulders fold down for exactly this reason. You feel like a surgeon. The onesie dies a hero.","effects":{"home":-3,"sanity":-2}}]},{"label":"Straight into the bath","duration":20,"outcomes":[{"text":"A bath at 10 AM. The tub is a crime scene. The rubber duck has seen things.","effects":{"home":-7,"mood":5,"sanity":-5}}]},{"label":"Call your partner in to \"see something\"","duration":5,"when":{"notFlags":["soloParent"]},"outcomes":[{"text":"They arrive, assess the situation, and slowly back out of the room. You are alone. You were always alone.","effects":{"sanity":-6,"home":-3}},{"text":"They take over without a word. You love them. You will tell them later. Maybe.","effects":{"sanity":8}}]}]},{"id":"content","title":"Content Opportunity","text":"Your toddler is doing something genuinely adorable with a wooden spoon. This could be content. The algorithm hungers.","window":[480,1080],"weight":2,"choices":[{"label":"Stage the perfect photo for the feed","duration":20,"outcomes":[{"text":"Shot 47 is usable once you crop out the laundry. Caption: \"Slow mornings 🤍\". Nothing about this was slow.","effects":{"rep":12,"mood":-8,"sanity":-5},"count":{"posts":1}}]},{"label":"Just enjoy the moment","duration":5,"outcomes":[{"text":"You watch. You don't post. It's lovely. No one will ever know it happened, which haunts you slightly.","effects":{"sanity":6,"mood":5}}]},{"label":"Post it with a long caption about being present","duration":10,"outcomes":[{"text":"\"I put my phone away to be present,\" you type, on your phone. 214 likes.","effects":{"rep":7,"sanity":-2},"count":{"posts":1}},{"text":"Top comment: \"is that spoon BPA-free?\" You spend nine minutes drafting a reply. You delete it. You draft another.","effects":{"rep":-4,"sanity":-6},"count":{"posts":1}}]}]},{"id":"zoom","title":"Can Everyone See My Screen?","text":"You have a work call. \"Cameras on, it's a culture thing.\" Your toddler has entered the frame wearing only a colander.","window":[540,1020],"weight":2,"choices":[{"label":"Keep presenting like nothing is happening","duration":30,"outcomes":[{"text":"You present the Q3 roadmap while a small, pantsless figure does laps behind you. Nobody mentions it. Your manager says, \"Love the energy.\" Professionalism!","effects":{"rep":5,"sanity":-8,"mood":-5}}]},{"label":"Hand over a snack and mute yourself","duration":30,"outcomes":[{"text":"Mute. Unmute: \"Great point.\" Mute. Crumbs are now load-bearing in your keyboard.","effects":{"mood":6,"home":-4,"sanity":-2},"count":{"snacks":1}}]},{"label":"Introduce them to the team","duration":30,"outcomes":[{"text":"Everyone loves them. The meeting is derailed. Productivity is down, morale is up. You are named \"culture lead.\" Unpaid.","effects":{"rep":10,"mood":8}},{"text":"They scream \"BYE!\" and close your laptop. You have left the meeting. You may have left the company.","effects":{"rep":-8,"sanity":-6,"mood":4}}]}]},{"id":"screen","title":"The Screen","text":"Your toddler requests \"Sunshine Sing-Along,\" a show where a man in an alarming amount of corduroy sings about feelings. It's 22 minutes long. You could do so much in 22 minutes.","window":[480,1140],"weight":3,"choices":[{"label":"Put it on. You need this.","duration":25,"outcomes":[{"text":"You fold laundry, answer three emails, and stare at a wall. Somewhere, a study you'll never read judges you.","effects":{"sanity":10,"home":6,"mood":6,"rep":-6},"count":{"screen":22}}]},{"label":"No screens. Make a sensory bin instead.","duration":30,"outcomes":[{"text":"You fill a bin with dry rice. Within seconds the rice is not in the bin. The rice is everywhere. The rice is eternal.","effects":{"mood":6,"home":-12,"sanity":-6,"rep":6},"count":{"noSaid":1}}]},{"label":"Compromise: one episode, but it's educational","duration":25,"outcomes":[{"text":"It's \"educational.\" They learn that one man in corduroy can rhyme \"feelings\" with \"ceilings\" four times.","effects":{"mood":4,"sanity":6,"rep":-2},"count":{"screen":22}}]}]},{"id":"snack","title":"Snack O'Clock","text":"\"Snack,\" says your toddler. They ate four minutes ago. They are 80% snack and 20% opinion.","window":[420,1080],"weight":3,"repeatable":true,"choices":[{"label":"Hand over the crackers","duration":3,"outcomes":[{"text":"Seven crackers are eaten. Twelve are in the couch. The couch is very well fed.","effects":{"mood":6,"home":-2,"rep":-1},"count":{"snacks":1}}]},{"label":"Offer apple slices","duration":5,"outcomes":[{"weight":2,"text":"They eat one slice and declare war on the rest. Still counts.","effects":{"mood":3,"rep":3},"count":{"snacks":1}},{"weight":3,"text":"Each slice gets exactly one bite and is returned to you, like a cat delivering gifts.","effects":{"mood":-6,"home":-2},"count":{"snacks":1}}]},{"label":"\"We just had a snack.\"","duration":3,"outcomes":[{"text":"You hold the line. The line does not hold you. They lie on the kitchen floor in protest.","effects":{"mood":-8,"sanity":2},"count":{"noSaid":1}}]}]},{"id":"climber","title":"The Climber","text":"Your toddler has climbed the bookshelf and is standing on top, triumphant, like a tiny mountaineer. You did anchor that bookshelf. Right? Right?","window":[480,1100],"weight":2,"choices":[{"label":"Swoop in and get them down","duration":5,"outcomes":[{"text":"Rescued. They immediately begin climbing again. This is their sport now.","effects":{"mood":-6,"sanity":-5}}]},{"label":"Get them down, then anchor every piece of furniture in the house","duration":60,"outcomes":[{"text":"An hour of drilling into studs while your toddler \"helps.\" Every dresser is now anchored to the wall. You are a safety hero. Your back is not.","effects":{"home":10,"sanity":-6,"rep":5,"mood":3},"set":["anchored"]}]},{"label":"Get them down, then build a cushion climbing zone","duration":20,"outcomes":[{"text":"The couch is now an obstacle course. You will never reassemble it correctly. They climb happily until they're sleepy.","effects":{"mood":10,"home":-10,"sleepy":6}}]}]},{"id":"playground","title":"Playground Politics","text":"At the playground, another parent watches you like a hall monitor. Their child is eating quinoa from a bento box. Yours is eating sand.","window":[540,1080],"weight":2,"choices":[{"label":"Remove the sand. Produce a healthy snack.","duration":20,"outcomes":[{"text":"You present your emergency apple. It is bruised. The other parent's eyebrow climbs.","effects":{"rep":5,"mood":-4,"sleepy":8},"count":{"snacks":1}}]},{"label":"Make eye contact and eat your own snack","duration":20,"outcomes":[{"text":"You eat a granola bar while holding eye contact. It's a power move. Your kid eats more sand.","effects":{"rep":-6,"sanity":6,"sleepy":8,"mood":4}}]},{"label":"Strike up a conversation","duration":30,"outcomes":[{"text":"Turns out they're also falling apart. Their kid bit someone yesterday. You exchange numbers. You will never text.","effects":{"rep":8,"sanity":5,"sleepy":10}},{"text":"Thirty minutes on their \"screen-free, sugar-free, nap-optimized\" philosophy. Then their child bites yours.","effects":{"rep":-3,"sanity":-8,"sleepy":10,"mood":-5}}]}]},{"id":"grocery","title":"Aisle Seven","text":"Your toddler has spotted a cartoon-branded cereal containing 0% nutrition and 100% marshmallow. Marketing departments do their best work at exactly 34 inches off the ground.","window":[540,1020],"weight":2,"choices":[{"label":"Buy it. Pick your battles.","duration":20,"outcomes":[{"text":"You leave with the cereal and a tiny, smug passenger. The cashier says, \"You've got your hands full!\" Thank you, cashier.","effects":{"mood":10,"rep":-4,"sanity":-2}}]},{"label":"Say no. Brace for impact.","duration":20,"outcomes":[{"weight":1,"text":"They accept it. Nearby shoppers nod. You are a legend in Aisle Seven.","effects":{"mood":-4,"rep":8,"sanity":4},"count":{"noSaid":1}},{"weight":1,"text":"A full floor-level protest. An older shopper tells you to \"enjoy every moment.\" Two other parents give you a solemn nod of solidarity.","effects":{"mood":-14,"rep":2,"sanity":-6},"count":{"noSaid":1}}]},{"label":"Distract them with a free bakery balloon","duration":15,"outcomes":[{"text":"The balloon works for four minutes. Then it floats away, through the store, past every other family. Grief is a lesson, you suppose.","effects":{"mood":2,"sanity":-2,"rep":-2}}]}]},{"id":"truck","title":"Script Check","text":"Your toddler hits you with a toy truck. The parenting account you follow says to \"name the feeling and hold the boundary.\" It does not say what to do about the truck.","window":[420,1140],"weight":2,"choices":[{"label":"\"I won't let you hit. You're having big feelings.\"","duration":5,"outcomes":[{"weight":3,"text":"It works! They hug you. Then they hit you again, gently, to test the boundary.","effects":{"mood":5,"sanity":-2},"count":{"gentle":1}},{"weight":2,"text":"\"I'm not having big feelings,\" they say, and hit you with the truck again.","effects":{"mood":-5,"sanity":-5},"count":{"gentle":1}}]},{"label":"Confiscate the truck","duration":5,"outcomes":[{"text":"The truck is confiscated. A new war begins over the truck's location.","effects":{"mood":-10,"sanity":2},"count":{"noSaid":1}}]},{"label":"Say \"ow\" really dramatically","duration":3,"outcomes":[{"text":"They find this hilarious. You have a new job: dramatically saying \"ow.\"","effects":{"mood":6,"sanity":-3}},{"text":"They find this hilarious and want an encore. With a bigger truck.","effects":{"mood":4,"sanity":-6}}]}]},{"id":"groupchat","title":"The Group Chat","text":"The parents' group chat has 47 new messages. Someone is asking if it's normal that their two-year-old reads. Someone else is selling a $380 \"learning tower.\"","window":[480,1140],"weight":2,"choices":[{"label":"Reply with a cute photo","duration":10,"outcomes":[{"text":"Three hearts and a reply: \"omg mine won't wear clothes either.\" You feel seen.","effects":{"rep":8,"sanity":-2},"count":{"posts":1}}]},{"label":"Mute the chat","duration":2,"outcomes":[{"text":"Peace. You will miss the announcement that pajama day moved to Tuesday. You'll find out on Wednesday.","effects":{"rep":-6,"sanity":8}}]},{"label":"Ask for advice about the tantrums","duration":10,"outcomes":[{"text":"Fourteen replies. They all contradict each other. One just says \"essential oils.\"","effects":{"sanity":-6,"rep":-2}},{"text":"Someone replies \"same.\" That's all you needed.","effects":{"sanity":6,"rep":4}}]}]},{"id":"experts_no","title":"Experts Say","text":"A new study says children who hear \"no\" too often become anxious adults. A different new study says children who don't hear \"no\" become adults who yell at waiters.","window":[360,1140],"weight":1,"choices":[{"label":"Noted.","duration":2,"outcomes":[{"text":"You add it to your list of things to feel bad about. The list is a scroll now. At least you can cite it in the group chat.","effects":{"sanity":-3,"rep":3}}]},{"label":"Close the article","duration":2,"outcomes":[{"text":"You close it. You open another one. It's about screen time.","effects":{"sanity":-1}}]}]},{"id":"experts_sleep","title":"Experts Say","text":"Sleep experts recommend 11 to 14 hours of sleep a day for one- and two-year-olds, naps included. They did not say which hours. Your toddler has chosen \"different ones.\"","window":[360,1140],"weight":1,"choices":[{"label":"Noted.","duration":2,"outcomes":[{"text":"You do the math on your own sleep. You stop doing the math.","effects":{"sanity":-3}}]}]},{"id":"experts_food","title":"Experts Say","text":"Experts say a child may need to try a new food 8 to 10 times, or more, before accepting it. You are on attempt e rgeon.","effects":{"mood":14,"sanity":2,"rep":4}},{"weight":1,"text":"They see through it instantly. \"That's a FAKE banana.\"","effects":{"mood":-10,"sanity":-4}}]},{"label":"Get a new banana and let them peel it","duration":5,"outcomes":[{"text":"They peel it. They take one bite. They hand it to you to finish. The broken one is on the floor. You eat four bananas a day now. It's fine.","effects":{"mood":8,"sanity":-1,"home":-2}}]},{"label":"\"I hear that you're sad the banana broke.\"","duration":5,"outcomes":[{"text":"They nod solemnly. \"Banana broke,\" they agree. A moment of shared grief. Then peace. A nearby parent looks impressed.","effects":{"mood":6,"rep":3},"count":{"gentle":1}},{"text":"\"BANANA BROKE,\" they agree, at maximum volume, for nine minutes. Still: textbook validation. The account you follow would be proud.","effects":{"mood":-8,"sanity":-4,"rep":3},"count":{"gentle":1}}]}]},{"id":"potty_alarm","title":"The Potty Announcement","text":"\"I need to go potty!\" This could be the breakthrough. Or it could be the ninth false alarm today.","window":[420,1140],"weight":4,"repeatable":true,"when":{"flags":["potty"]},"choices":[{"label":"Sprint to the bathroom","duration":10,"outcomes":[{"weight":2,"text":"SUCCESS. You throw a three-minute celebration with a dance and a sticker. You have never been prouder of anything, including your career.","effects":{"mood":10,"sanity":6,"rep":4}},{"weight":3,"text":"False alarm. Then a real alarm, two minutes later, on the rug.","effects":{"sanity":-5,"home":-5}}]},{"label":"\"Are you SURE?\"","duration":5,"outcomes":[{"text":"They were sure.","effects":{"home":-10,"sanity":-5}},{"text":"They were not sure. They just wanted to flush. Repeatedly. Forever.","effects":{"mood":3,"sanity":-2}}]}]},{"id":"art","title":"Art Hour","text":"Pinterest says toddlers love \"process art.\" You put out washable paint. \"Washable\" is a promise, not a guarantee.","window":[540,1080],"weight":2,"choices":[{"label":"Let them go wild" // ---- Playtest UI. Rules live in the engine above; this only renders. ----
const app = document.getElementById("app");
const cfg = CONTENT.config;
const SAVE_KEY = "bedtime-or-bust.save.v1";
const STATS_KEY = "bedtime-or-bust.stats.v1";
const QUALITY = ["sanity", "mood", "home", "rep"];
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const name = (m) => CONTENT.meters[m];

const storage = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* storage unavailable */ } },
};

let session = null; // { seed, picks, game, screen, last }

function persist() {
  if (!session) return;
  if (session.game.isOver && session.screen === "ending") storage.del(SAVE_KEY);
  else storage.set(SAVE_KEY, { v: CONTENT.version, seed: session.seed, picks: session.picks, screen: session.screen });
}

// A saved day is just its seed plus the choices made: replaying them through
// the deterministic engine rebuilds the exact state.
function rebuild(saved) {
  try {
    if (!saved || saved.v !== CONTENT.version || typeof saved.seed !== "number") return null;
    const game = new Game(CONTENT, saved.seed);
    let last = null;
    for (const p of saved.picks ?? []) last = game.choose(p);
    const screen = ["intro", "event", "outcome", "ending"].includes(saved.screen) ? saved.screen : "event";
    return { seed: saved.seed, picks: [...(saved.picks ?? [])], game, screen: screen === "outcome" && !last ? "event" : screen, last };
  } catch {
    return null;
  }
}

function newDay(seed = Math.floor(Math.random() * 4294967296)) {
  session = { seed, picks: [], game: new Game(CONTENT, seed), screen: "intro", last: null };
  persist();
  render();
}

function choose(i) {
  const g = session.game;
  if (g.isOver || session.screen !== "event") return;
  if (!(i >= 0 && i < g.visibleChoices().length)) return;
  session.last = g.choose(i);
  session.picks.push(i);
  session.screen = "outcome";
  if (g.isOver) recordStats(g);
  persist();
  render();
}

function next() {
  session.screen = session.game.isOver ? "ending" : "event";
  persist();
  render();
}

function recordStats(g) {
  const s = storage.get(STATS_KEY) ?? { played: 0, won: 0, best: 0, endings: [] };
  s.played += 1;
  const kind = CONTENT.endings[g.state.endingId].kind;
  if (kind === "win") { s.won += 1; s.best = Math.max(s.best, g.score()); }
  if (!s.endings.includes(g.state.endingId)) s.endings.push(g.state.endingId);
  storage.set(STATS_KEY, s);
}

// ---- Views ----
function lcd(minutes) {
  const [hm, ap] = formatClock(minutes).split(" ");
  const [h, m] = hm.split(":");
  return `<div class="lcd" role="img" aria-label="${esc(formatClock(minutes))}">${h}<span class="colon">:</span>${m} <small>${ap}</small></div>`;
}

function meterRow(m, value, { wide = false } = {}) {
  const danger = m !== "sleepy" && value <= 20;
  let extra = "";
  let label = name(m);
  if (m === "sleepy") {
    extra = `<span class="zone" style="left:${cfg.overtiredAt}%;right:0"></span><span class="tick" style="left:${cfg.asleepThreshold}%"></span>`;
  }
  return `<div class="meter${wide ? " wide" : ""}${danger ? " danger" : ""}" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}">
    <div class="meter-head"><span class="swatch" style="background:var(--${m})"></span><span class="name">${esc(label)}</span><span class="val">${value}</span></div>
    <div class="bar"><span class="fill" style="width:${value}%;background:var(--${m})"></span>${extra}</div>
  </div>`;
}

function hud(g) {
  const m = g.state.meters;
  const span = cfg.bedtimeClock - cfg.startClock;
  const pct = Math.max(0, Math.min(100, ((g.state.clock - cfg.startClock) / span) * 100));
  const mod = g.modifier;
  return `<section class="hud" aria-label="Status">
    <div class="hud-top">${lcd(g.state.clock)}<span class="pill">${esc(mod.title)}</span></div>
    <div class="day-track" aria-label="Progress to bedtime: ${Math.round(pct)}%">
      <div class="bar"><span class="fill" style="width:${pct}%;background:var(--sleepy)"></span></div>
      <div class="ends"><span>${formatClock(cfg.startClock)}</span><span>Bedtime ${formatClock(cfg.bedtimeClock)}</span></div>
    </div>
    <div class="meters">
      ${QUALITY.map((k) => meterRow(k, m[k])).join("")}
      ${meterRow("sleepy", m.sleepy, { wide: true })}
    </div>
    <p class="sleep-note">Sleepiness must reach the line (${cfg.asleepThreshold}) by bedtime. In the striped zone (${cfg.overtiredAt}+) they are overtired and their mood drops.</p>
  </section>`;
}

function chips(deltas) {
  const keys = METERS.filter((k) => deltas[k]);
  if (!keys.length) return "";
  return `<div class="chips">${keys.map((k) => {
    const d = deltas[k];
    const cls = k === "sleepy" ? "neutral" : d > 0 ? "good" : "bad";
    return `<span class="chip ${cls}">${d > 0 ? "+" : "−"}${Math.abs(d)} ${esc(name(k))}</span>`;
  }).join("")}</div>`;
}

function titleView() {
  const saved = storage.get(SAVE_KEY);
  const canResume = !!rebuild(saved);
  const s = storage.get(STATS_KEY);
  return `<section class="title-screen enter">
    <div class="lcd" aria-hidden="true">5<span class="colon">:</span>58 <small>AM</small></div>
    <h1>Bedtime <span>or</span> Bust</h1>
    <p class="tag">One day. One toddler. One goal: make it to ${formatClock(cfg.bedtimeClock)}.</p>
    <div class="actions">
      ${canResume ? `<button class="block primary" data-act="resume">Continue today</button>` : ""}
      <button class="block ${canResume ? "" : "primary"}" data-act="new"><span class="label">${canResume ? "Start a new day" : "Start the day"}</span></button>
    </div>
    <details class="help">
      <summary>How to play</summary>
      <ul>
        <li>Each card is a moment of your day. Every choice costs time and moves your meters.</li>
        <li><b>Sanity</b>, <b>House</b> or <b>Reputation</b> at zero ends the day early. <b>Toddler Mood</b> at zero means a meltdown: survivable, but expensive.</li>
        <li><b>Sleepiness</b> climbs all day and naps lower it. At bedtime it must be ${cfg.asleepThreshold}+ or they get a second wind. Above ${cfg.overtiredAt} they are overtired.</li>
        <li>Asleep at bedtime? Your day is graded on the total of the four main meters.</li>
        <li>Keys 1–3 pick a choice.</li>
      </ul>
    </details>
    ${s && s.played ? `<p class="muted small">Days survived: ${s.won} of ${s.played} · Best score: ${s.best} · Endings found: ${s.endings.length} of ${Object.keys(CONTENT.endings).length}</p>` : ""}
    <footer>Playtest build. Same rules and content as the iOS app.</footer>
  </section>`;
}

function introView(g) {
  const mod = g.modifier;
  return `<section class="enter" style="display:grid;gap:16px">
    <p class="eyebrow">Today's forecast</p>
    <article class="note">
      <h2>${esc(mod.title)}</h2>
      <p class="text">${esc(mod.text)}</p>
      ${chips(mod.effects ?? {})}
    </article>
    <p class="muted small">Bedtime is ${formatClock(cfg.bedtimeClock)}. Sleepiness needs to be ${cfg.asleepThreshold} or more when it arrives.</p>
    <button class="block primary" data-act="begin">It's ${formatClock(g.state.clock)}. Begin.</button>
  </section>`;
}

function eventView(g) {
  const ev = g.currentEvent;
  const choices = g.visibleChoices();
  return `${hud(g)}
  <article class="note enter" aria-labelledby="ev-title">
    <h2 id="ev-title">${esc(ev.title)}</h2>
    <p class="text">${esc(ev.text)}</p>
  </article>
  <div class="choices">
    ${choices.map((c, i) => `<button class="block" data-act="choose" data-i="${i}"><span class="key" aria-hidden="true">${i + 1}</span><span class="label">${esc(c.label)}</span><span class="mins">${c.duration} min</span></button>`).join("")}
  </div>`;
}

function outcomeView(g, r) {
  const ev = CONTENT.events.find((e) => e.id === r.eventId);
  return `${hud(g)}
  <article class="note enter">
    <p class="eyebrow">${esc(ev.title)}</p>
    <p class="text">${esc(r.text)}</p>
    ${chips(r.deltas)}
    <p class="muted small">${r.minutes} minutes pass. It's now ${formatClock(g.state.clock)}.</p>
  </article>
  <button class="block primary" data-act="next">${g.isOver ? "How did the day end?" : "Continue"}</button>`;
}

function shareText(g) {
  const e = g.ending;
  const m = g.state.meters;
  const verdict = e.kind === "win" ? "made it to bedtime" : e.kind === "soft" ? "made it to bedtime, but the toddler did not" : "did not make it to bedtime";
  return `I ${verdict} in Bedtime or Bust: "${e.title}" (${g.score()}/400).\nSanity ${m.sanity} · Mood ${m.mood} · House ${m.home} · Reputation ${m.rep} · Sleepiness ${m.sleepy}`;
}

function endingView(g) {
  const e = g.ending;
  const badge = { win: "Asleep by bedtime", soft: "Still awake", loss: "Game over" }[e.kind];
  const rows = CONTENT.counters.map((c) => `<div class="row"><span>${esc(c.label)}</span><span>${g.state.counters[c.id] ?? 0}</span></div>`).join("");
  return `<section class="ending-head enter">
    <span class="badge ${e.kind}">${badge}</span>
    <h1>${esc(e.title)}</h1>
  </section>
  <article class="note">
    <p class="text">${esc(e.text)}</p>
    ${e.kind === "win" ? `<p class="score">${g.score()} <span class="muted small">/ 400</span></p>` : ""}
    <p class="muted small">Day ended at ${formatClock(g.state.clock)} after ${g.state.step} decisions. Forecast: ${esc(g.modifier.title)}.</p>
  </article>
  <section class="meters" aria-label="Final meters">
    ${QUALITY.map((k) => meterRow(k, g.state.meters[k])).join("")}
    ${meterRow("sleepy", g.state.meters.sleepy, { wide: true })}
  </section>
  <section class="receipt" aria-label="Today's receipt">
    <h3>TODAY'S RECEIPT</h3>
    <div class="rule"></div>
    ${rows}
    <div class="rule"></div>
    <div class="row total"><span>CRISES SURVIVED</span><span>${g.state.step}</span></div>
    <p class="thanks">NO REFUNDS. NO EXCHANGES. SEE YOU TOMORROW AT 5:58.</p>
  </section>
  <section class="share">
    <label for="share-text" class="eyebrow">Share your day</label>
    <textarea id="share-text" readonly>${esc(shareText(g))}</textarea>
    <button class="block" data-act="copy"><span class="label" id="copy-label">Copy result</span></button>
  </section>
  <button class="block primary" data-act="new">Try another day</button>
  <button class="linkish" data-act="title">Back to title</button>`;
}

function render() {
  let html;
  if (!session) html = titleView();
  else {
    const g = session.game;
    if (session.screen === "intro") html = introView(g);
    else if (session.screen === "outcome" && session.last) html = outcomeView(g, session.last);
    else if (session.screen === "ending" || g.isOver) html = endingView(g);
    else html = eventView(g);
  }
  app.innerHTML = html;
  window.scrollTo({ top: 0 });
  // Keyboard players land on the first choice (or Continue) of each card.
  if (session && (session.screen === "event" || session.screen === "outcome")) {
    app.querySelector(".block")?.focus({ preventScroll: true });
  }
}

app.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "new") newDay();
  else if (act === "resume") { session = rebuild(storage.get(SAVE_KEY)); render(); }
  else if (act === "begin") { session.screen = "event"; persist(); render(); }
  else if (act === "choose") choose(Number(btn.dataset.i));
  else if (act === "next") next();
  else if (act === "title") { session = null; render(); }
  else if (act === "copy") {
    const text = shareText(session.game);
    const label = document.getElementById("copy-label");
    try {
      await navigator.clipboard.writeText(text);
      label.textContent = "Copied";
    } catch {
      const ta = document.getElementById("share-text");
      ta.focus();
      ta.select();
      label.textContent = "Selected. Copy it from the box above.";
    }
  }
});

document.addEventListener("keydown", (ev) => {
  if (!session || session.screen !== "event" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const n = Number(ev.key);
  if (n >= 1 && n <= 3) { ev.preventDefault(); choose(n - 1); }
});

// Keep a game in progress across live updates of this page.
if (typeof window.claude?.hot?.snapshot === "function") {
  window.claude.hot.snapshot(() => (session ? { seed: session.seed, picks: session.picks, screen: session.screen, v: CONTENT.version } : {}));
}
function start(data) {
  const restored = rebuild(data);
  if (restored) session = restored;
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>
